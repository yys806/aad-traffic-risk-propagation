[project]
name = "riskprop-pilot"
version = "0.1.0"
description = "AAD formal traffic-risk experiment tools with archived legacy Pilot pipelines."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=25.0,<26",
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
# Backward-compatible historical Pilot CLI; current formal experiments use scripts/.
riskprop = "riskprop.legacy.cli:main"
riskprop-legacy = "riskprop.legacy.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
